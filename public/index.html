<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="description" content="Search which places movies have links to, on a map of everywhere Wikipedia connects them">
    <meta name="theme-color" content="#ffffff">

    <meta property="og:title" content="Movie Mapper">
    <meta property="og:url" content="https://movie.exussum.co.uk/">
    <meta property="og:description" content="Search locations for movie connections">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Movie Mapper">
    <meta name="twitter:description" content="Search locations for movie connections">

    <title>Movie Mapper: find the films linked to places near you</title>

    <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://tiles.openfreemap.org">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.css" integrity="sha384-MinO0mNliZ3vwppuPOUnGa+iq619pfMhLVUXfC4LHwSCvF9H+6P/KO4Q7qBOYV5V" crossorigin="anonymous">
    <link rel="stylesheet" href="assets/app.css">
</head>
<body>
<main class="app">
    <div id="map" aria-label="Map of places with film links. The list of places offers the same links."></div>

    <aside id="card" class="card" aria-label="Search and results">
        <button id="handle" class="handle" type="button" aria-label="Show more of the list" aria-expanded="false"><span></span></button>

        <header class="card-top">
            <h1 class="wordmark"><a href="#" id="home">Movie Mapper</a></h1>
            <button id="about-link" class="quiet-link" type="button">About</button>
        </header>

        <form id="search" class="search" role="search">
            <label class="search-box">
                <span class="visually-hidden">Search films and places</span>
                <svg class="icon" viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5"/><path d="m13 13 5 5"/></svg>
                <input id="term" type="search" placeholder="Search films and places" autocomplete="off" enterkeyhint="search">
            </label>
            <div class="pills">
                <button id="near-me" class="pill" type="button">
                    <svg class="icon" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="4.5"/><path d="M10 2v3.5M10 14.5V18M2 10h3.5M14.5 10H18"/></svg>
                    Near me
                </button>
                <button id="filters-toggle" class="pill" type="button" aria-expanded="false" aria-controls="filters">
                    <svg class="icon" viewBox="0 0 20 20" aria-hidden="true"><path d="M3 6h14M6 10h8M9 14h2"/></svg>
                    IMDb filters <span id="filter-count"></span>
                </button>
            </div>
            <div id="filters" class="filters" hidden>
                <div class="filter-grid">
                    <label>Min score
                        <select id="min-score"></select>
                    </label>
                    <label>Max score
                        <select id="max-score"></select>
                    </label>
                    <label>Votes
                        <select id="votes-mode">
                            <option value="gt">Greater than</option>
                            <option value="lt">Less than</option>
                        </select>
                    </label>
                    <label>Amount of votes
                        <input id="votes" type="number" inputmode="numeric" min="0" step="1000" placeholder="Any">
                    </label>
                </div>
                <button id="clear-filters" class="text-button" type="button">Clear filters</button>
            </div>
        </form>

        <div id="panel" class="panel" tabindex="-1"></div>
    </aside>

    <p id="toast" class="toast" role="status" hidden></p>
</main>

<noscript><p class="noscript">Movie Mapper needs JavaScript to draw its map.</p></noscript>

<script src="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.js" integrity="sha384-SYKAG6cglRMN0RVvhNeBY0r3FYKNOJtznwA0v7B5Vp9tr31xAHsZC0DqkQ/pZDmj" crossorigin="anonymous"></script>
<script src="assets/app.js"></script>
</body>
</html>
